<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Questionário — Kit de Festas & Arcos</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  :root {
    --coral: #E86A5C;
    --coral-dark: #cf5346;
    --cream: #FFF8F3;
    --ink: #2f2a28;
    --muted: #8a807b;
    --card: #ffffff;
    --line: #f0e4db;
    --green: #25D366;
    --green-dark: #1da851;
  }
  html, body { background: var(--cream); color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    line-height: 1.45; }
  .wrap { max-width: 560px; margin: 0 auto; min-height: 100vh; display: flex; flex-direction: column; }
  header { padding: 18px 20px 12px; position: sticky; top: 0; background: var(--cream); z-index: 5; }
  .kicker { font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: var(--coral); font-weight: 700; }
  h1 { font-size: 19px; margin-top: 2px; }
  .progress { height: 6px; background: var(--line); border-radius: 99px; margin-top: 12px; overflow: hidden; }
  .bar { height: 100%; background: var(--coral); width: 0%; transition: width .3s ease; border-radius: 99px; }
  .step-label { font-size: 12px; color: var(--muted); margin-top: 6px; }
  main { flex: 1; padding: 4px 20px 20px; }
  .section-title { font-size: 22px; font-weight: 800; margin: 14px 0 4px; }
  .section-emoji { font-size: 30px; }
  .section-sub { color: var(--muted); font-size: 13px; margin-bottom: 8px; }
  .q { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 16px; margin-top: 14px; box-shadow: 0 1px 2px rgba(0,0,0,.03); }
  .q-label { font-weight: 700; font-size: 15px; margin-bottom: 4px; }
  .q-hint { font-size: 12.5px; color: var(--muted); margin-bottom: 10px; }
  input[type=text], textarea {
    width: 100%; border: 1.5px solid var(--line); border-radius: 12px; padding: 12px 14px;
    font-size: 16px; font-family: inherit; color: var(--ink); background: #fffdfb; resize: vertical; }
  input[type=text]:focus, textarea:focus { outline: none; border-color: var(--coral); }
  textarea { min-height: 74px; }
  .opts { display: flex; flex-direction: column; gap: 8px; margin-top: 6px; }
  .opt { display: flex; align-items: center; gap: 12px; border: 1.5px solid var(--line); border-radius: 12px;
    padding: 12px 14px; cursor: pointer; font-size: 15px; transition: all .15s; background: #fffdfb; }
  .opt input { display: none; }
  .dot { width: 20px; height: 20px; border-radius: 50%; border: 2px solid #d8ccc3; flex-shrink: 0; position: relative; }
  .opt.checked { border-color: var(--coral); background: #fff2ee; }
  .opt.checked .dot { border-color: var(--coral); }
  .opt.checked .dot::after { content:''; position:absolute; inset:3px; background: var(--coral); border-radius:50%; }
  nav { position: sticky; bottom: 0; background: var(--cream); padding: 12px 20px calc(12px + env(safe-area-inset-bottom));
    display: flex; gap: 10px; border-top: 1px solid var(--line); }
  button { font-family: inherit; font-size: 16px; font-weight: 700; border: none; border-radius: 14px;
    padding: 15px; cursor: pointer; transition: transform .06s; }
  button:active { transform: scale(.98); }
  .btn-next { flex: 1; background: var(--coral); color: #fff; }
  .btn-back { background: #fff; color: var(--muted); border: 1.5px solid var(--line); padding: 15px 20px; }
  .btn-wa { background: var(--green); color: #fff; width: 100%; display:flex; align-items:center; justify-content:center; gap:8px; }
  .btn-copy { background: #fff; color: var(--ink); border: 1.5px solid var(--line); width: 100%; margin-top: 10px; }
  .skip-note { text-align:center; font-size:12px; color: var(--muted); margin-top: 14px; }
  /* final */
  .done-emoji { font-size: 48px; text-align: center; margin-top: 10px; }
  .summary { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 16px;
    margin-top: 14px; font-size: 13.5px; white-space: pre-wrap; max-height: 40vh; overflow-y: auto; color: #4a423e; }
  .toast { position: fixed; bottom: 90px; left: 50%; transform: translateX(-50%); background: var(--ink); color:#fff;
    padding: 10px 18px; border-radius: 99px; font-size: 14px; opacity: 0; transition: opacity .25s; pointer-events:none; }
  .toast.show { opacity: 1; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="kicker">Análise de negócio</div>
    <h1>Kit de Festas + Arcos de Balão</h1>
    <div class="progress"><div class="bar" id="bar"></div></div>
    <div class="step-label" id="stepLabel"></div>
  </header>
  <main id="main"></main>
  <nav id="nav"></nav>
</div>
<div class="toast" id="toast"></div>

<script>
const SECTIONS = [
  { emoji:"👋", title:"Sobre você", sub:"Pra entender de onde você parte.", qs:[
    {id:"nome", type:"text", label:"Seu nome", ph:"Ex: Ana"},
    {id:"motivacao", type:"radio", label:"Por que quer entrar nesse ramo?", opts:["Renda extra","Negócio principal","Aproveitar uma habilidade que já tenho","Ainda estou decidindo"]},
    {id:"tempo", type:"radio", label:"Quanto tempo consegue dedicar?", opts:["Poucas horas por semana","Meio período","Período integral"]},
    {id:"jaFazArcos", type:"radio", label:"Você já faz arcos de balão hoje?", opts:["Sim, já vendo pra clientes","Faço, mas só pra conhecidos/hobby","Nunca vendi"]},
    {id:"ajuda", type:"radio", label:"Vai tocar sozinha?", opts:["Sozinha","Tenho quem ajude às vezes","Tenho um(a) parceiro(a) fixo(a)"]},
  ]},
  { emoji:"🎪", title:"O kit de locação", sub:"O que você pretende alugar.", qs:[
    {id:"itensKit", type:"textarea", label:"Quais itens compõem o kit?", hint:"Ex: mesa, painel/backdrop, torre de doces, suportes, cilindros, tapete...", ph:"Liste os itens"},
    {id:"jaTemItens", type:"radio", label:"Você já tem esses itens?", opts:["Não tenho nada ainda","Tenho alguns","Tenho quase tudo"]},
    {id:"quantosKits", type:"radio", label:"Quantos kits pretende ter no começo?", opts:["Um kit só","2 a 3 temas/cores","Vários desde o início"]},
    {id:"entrega", type:"radio", label:"Como o cliente recebe?", opts:["Cliente retira e devolve","Eu entrego e busco","Eu entrego, monto e desmonto"]},
  ]},
  { emoji:"🎈", title:"Arcos de balão", sub:"O seu diferencial.", qs:[
    {id:"tiposArco", type:"textarea", label:"Que tipos de arco você faz?", hint:"Tamanhos, orgânico, desconstruído, com estrutura de metal...", ph:"Descreva"},
    {id:"tempoArco", type:"text", label:"Quanto tempo leva pra montar um arco médio?", ph:"Ex: 1h30"},
    {id:"estruturaReuso", type:"radio", label:"A estrutura (base/haste) é reaproveitável?", opts:["Reaproveito a estrutura","Monto do zero cada vez","Depende do modelo"]},
    {id:"arcoJunto", type:"radio", label:"O arco vai junto do kit?", opts:["Sempre junto (pacote)","Vendo junto e separado","Só separado"]},
  ]},
  { emoji:"💸", title:"Custos e material", sub:"Quanto sai do bolso.", qs:[
    {id:"custoKit", type:"text", label:"Quanto estima gastar pra montar o(s) kit(s)?", ph:"Ex: R$ 3.000"},
    {id:"custoArco", type:"text", label:"Custo de material de UM arco?", hint:"Bexigas, fita, cola, bomba...", ph:"Ex: R$ 80"},
    {id:"custosFixos", type:"textarea", label:"Tem custos fixos mensais?", hint:"Aluguel de espaço, transporte, marketing... Se não tem, escreva 'não tenho'.", ph:"Liste ou escreva 'não tenho'"},
    {id:"transporte", type:"radio", label:"Como vai transportar os itens?", opts:["Tenho carro adequado","Tenho carro pequeno","Não tenho / dependo de terceiros"]},
  ]},
  { emoji:"🏷️", title:"Preço e concorrência", sub:"O que o mercado cobra e o que você quer cobrar.", qs:[
    {id:"precoConcKit", type:"text", label:"Quanto cobram por locação de kit parecido na sua região?", ph:"Ex: R$ 250 a R$ 400 / não sei"},
    {id:"precoConcArco", type:"text", label:"E por arco de balão?", ph:"Ex: R$ 150 o metro / não sei"},
    {id:"precoPretKit", type:"text", label:"Quanto você PRETENDE cobrar pelo kit?", ph:"Ex: R$ 300"},
    {id:"precoPretArco", type:"text", label:"E pelo arco avulso?", ph:"Ex: R$ 180"},
    {id:"concorrentes", type:"textarea", label:"Quem são seus concorrentes diretos?", hint:"O que eles fazem bem e mal?", ph:"Opcional"},
  ]},
  { emoji:"🎯", title:"Cliente e divulgação", sub:"Quem compra e como te acha.", qs:[
    {id:"cliente", type:"textarea", label:"Quem é o cliente principal?", hint:"Ex: mãe de aniversário infantil, festa adulta, chá de bebê, empresa...", ph:"Descreva"},
    {id:"comoChega", type:"textarea", label:"Como o cliente chegaria até você?", hint:"Instagram, indicação, grupos de bairro, marketplace...", ph:"Descreva"},
    {id:"baseAtual", type:"radio", label:"Você tem alguma base hoje?", opts:["Já tenho clientes/seguidores","Tenho poucos contatos","Começaria do zero"]},
    {id:"regiao", type:"text", label:"Qual região pretende atender?", ph:"Ex: bairro X e vizinhança, até 10km"},
  ]},
  { emoji:"⚙️", title:"Operação", sub:"O dia a dia — onde geralmente mora o problema.", qs:[
    {id:"capacidade", type:"text", label:"Quantas festas/arcos consegue atender por fim de semana sem se sobrecarregar?", ph:"Ex: 2 a 3"},
    {id:"controleReserva", type:"radio", label:"Como controlaria as reservas de data?", opts:["Já penso em agenda/sistema","Anotaria no caderno/celular","Não tinha pensado nisso"]},
    {id:"quebra", type:"radio", label:"E se devolverem o kit quebrado, sujo ou incompleto?", opts:["Vou cobrar caução + contrato","Só contrato","Ainda não pensei nisso"]},
    {id:"estoque", type:"text", label:"Onde os itens ficam guardados entre uma festa e outra?", ph:"Ex: quarto de despejo, garagem..."},
  ]},
  { emoji:"📊", title:"Dinheiro e risco", sub:"A saúde financeira do negócio.", qs:[
    {id:"investimento", type:"text", label:"Quanto tem disponível pra investir SEM apertar o orçamento da casa?", ph:"Ex: R$ 4.000"},
    {id:"origemDinheiro", type:"radio", label:"De onde vem esse dinheiro?", opts:["Reserva minha","Do orçamento da casa","Emprestado","Misto"]},
    {id:"retorno", type:"text", label:"Em quanto tempo gostaria de recuperar o investimento?", ph:"Ex: 6 meses"},
    {id:"rendaAlvo", type:"text", label:"Quanto o negócio precisa gerar por mês pra valer a pena?", ph:"Ex: R$ 1.500 líquidos"},
  ]},
  { emoji:"📄", title:"Formalização", sub:"Últimos detalhes.", qs:[
    {id:"formalizar", type:"radio", label:"Pretende formalizar?", opts:["Já sou MEI/CNPJ","Pretendo formalizar","Começar informal","Não sei ainda"]},
    {id:"pagamento", type:"textarea", label:"Como vai receber?", hint:"Pix, cartão, maquininha, nota fiscal...", ph:"Descreva"},
  ]},
];

let cur = 0;
const answers = {};
const main = document.getElementById('main');
const nav = document.getElementById('nav');
const bar = document.getElementById('bar');
const stepLabel = document.getElementById('stepLabel');
const toast = document.getElementById('toast');
const TOTAL = SECTIONS.length;

function esc(s){ return (s||'').replace(/[&<>"]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

function render(){
  if (cur < TOTAL) renderSection(SECTIONS[cur]);
  else renderDone();
  bar.style.width = ((cur)/(TOTAL))*100 + '%';
  window.scrollTo(0,0);
  const mainEl = document.querySelector('.wrap'); if(mainEl) mainEl.scrollTop = 0;
}

function renderSection(sec){
  stepLabel.textContent = `Seção ${cur+1} de ${TOTAL} · ${sec.title}`;
  let html = `<div class="section-emoji">${sec.emoji}</div>
    <div class="section-title">${sec.title}</div>
    <div class="section-sub">${sec.sub}</div>`;
  sec.qs.forEach(q=>{
    html += `<div class="q"><div class="q-label">${q.label}</div>`;
    if(q.hint) html += `<div class="q-hint">${q.hint}</div>`;
    if(q.type==='text') html += `<input type="text" data-id="${q.id}" placeholder="${q.ph||''}" value="${esc(answers[q.id])}">`;
    else if(q.type==='textarea') html += `<textarea data-id="${q.id}" placeholder="${q.ph||''}">${esc(answers[q.id])}</textarea>`;
    else if(q.type==='radio'){
      html += `<div class="opts">`;
      q.opts.forEach(o=>{
        const on = answers[q.id]===o ? 'checked':'';
        html += `<label class="opt ${on}" data-q="${q.id}" data-v="${esc(o)}"><span class="dot"></span><span>${o}</span></label>`;
      });
      html += `</div>`;
    }
    html += `</div>`;
  });
  html += `<div class="skip-note">Pode pular o que ainda não souber responder.</div>`;
  main.innerHTML = html;

  main.querySelectorAll('input[type=text], textarea').forEach(el=>{
    el.addEventListener('input', e=> answers[e.target.dataset.id] = e.target.value );
  });
  main.querySelectorAll('.opt').forEach(el=>{
    el.addEventListener('click', ()=>{
      const q = el.dataset.q, v = el.dataset.v;
      answers[q] = v;
      main.querySelectorAll(`.opt[data-q="${q}"]`).forEach(o=>o.classList.remove('checked'));
      el.classList.add('checked');
    });
  });

  nav.innerHTML = `${cur>0?'<button class="btn-back" id="back">Voltar</button>':''}
    <button class="btn-next" id="next">${cur===TOTAL-1?'Ver resumo':'Próximo'}</button>`;
  const b=document.getElementById('back'); if(b) b.onclick=()=>{cur--;render();};
  document.getElementById('next').onclick=()=>{cur++;render();};
}

function buildSummary(){
  let t = `📋 QUESTIONÁRIO — KIT DE FESTAS + ARCOS DE BALÃO\n`;
  if(answers.nome) t += `Respondido por: ${answers.nome}\n`;
  t += `Data: ${new Date().toLocaleDateString('pt-BR')}\n`;
  SECTIONS.forEach(sec=>{
    let block = '';
    sec.qs.forEach(q=>{
      if(q.id==='nome') return;
      const a = (answers[q.id]||'').trim();
      if(a) block += `• ${q.label}\n   → ${a}\n`;
    });
    if(block) t += `\n${sec.emoji} ${sec.title.toUpperCase()}\n${block}`;
  });
  return t.trim();
}

function renderDone(){
  stepLabel.textContent = `Concluído · ${TOTAL} de ${TOTAL}`;
  const summary = buildSummary();
  main.innerHTML = `<div class="done-emoji">🎉</div>
    <div class="section-title" style="text-align:center">Tudo pronto!</div>
    <div class="section-sub" style="text-align:center">Confira e envie pro Felipe. É só tocar no botão verde e escolher o contato dele.</div>
    <div class="summary" id="sum">${esc(summary)}</div>`;
  nav.innerHTML = `<button class="btn-back" id="back">Voltar</button>
    <div style="flex:1">
      <button class="btn-wa" id="wa"><span>📲</span> Enviar no WhatsApp</button>
      <button class="btn-copy" id="copy">Copiar respostas</button>
    </div>`;
  document.getElementById('back').onclick=()=>{cur--;render();};
  document.getElementById('wa').onclick=()=>{
    window.open('https://wa.me/?text='+encodeURIComponent(summary),'_blank');
  };
  document.getElementById('copy').onclick=async()=>{
    try{ await navigator.clipboard.writeText(summary); showToast('Copiado! ✅'); }
    catch(e){ const s=document.getElementById('sum'); const r=document.createRange(); r.selectNodeContents(s); const sel=getSelection(); sel.removeAllRanges(); sel.addRange(r); showToast('Selecionado — toque em copiar'); }
  };
  bar.style.width='100%';
}

function showToast(msg){ toast.textContent=msg; toast.classList.add('show'); setTimeout(()=>toast.classList.remove('show'),1800); }

render();
</script>
</body>
</html>
