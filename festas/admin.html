<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Painel — Reservas de Kits</title>
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#E86A5C">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  :root { --coral:#E86A5C; --coral-dark:#cf5346; --cream:#FFF8F3; --ink:#2f2a28; --muted:#8a807b; --card:#fff; --line:#f0e4db; --soft:#fff2ee; }
  body { background: var(--cream); color: var(--ink); font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; line-height:1.45; }
  .wrap { max-width: 1000px; margin: 0 auto; padding: 20px; }
  h1 { font-size: 20px; } .kicker { font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--coral);font-weight:700; }
  .bar { display:flex; gap:10px; align-items:center; flex-wrap:wrap; margin: 14px 0; }
  input, select, button { font-family:inherit; font-size:15px; border-radius:11px; padding:11px 13px; border:1.5px solid var(--line); }
  input, select { background:#fffdfb; color:var(--ink); }
  button { font-weight:700; border:none; cursor:pointer; }
  .btn { background: var(--coral); color:#fff; } .btn:hover{ background:var(--coral-dark); }
  .btn-sm { padding:8px 12px; font-size:13px; border-radius:9px; }
  .btn-ok { background:#1da851; color:#fff; } .btn-no { background:#fff; color:#a3271b; border:1.5px solid #f0c6c0; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:14px; padding:14px; }
  table { width:100%; border-collapse: collapse; font-size:13.5px; }
  th, td { text-align:left; padding:10px 8px; border-bottom:1px solid var(--line); vertical-align: top; }
  th { font-size:11.5px; text-transform:uppercase; letter-spacing:.05em; color:var(--muted); }
  .tag { display:inline-block; font-size:11px; font-weight:700; padding:3px 9px; border-radius:99px; white-space:nowrap; }
  .t-AGUARDANDO_PAGAMENTO { background:#fff4e5; color:#9a6a12; }
  .t-PAGO { background:#e7f7ec; color:#1a7a3c; }
  .t-CONCLUIDO { background:#eef; color:#3a3aa0; }
  .t-CANCELADO { background:#fdecea; color:#a3271b; }
  .actions { display:flex; gap:6px; }
  .muted { color:var(--muted); } .right { text-align:right; }
  .stats { display:flex; gap:10px; flex-wrap:wrap; margin-bottom:14px; }
  .stat { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:10px 14px; min-width:110px; }
  .stat b { font-size:20px; display:block; } .stat span { font-size:12px; color:var(--muted); }
  .center { text-align:center; padding:40px; color:var(--muted); }
  .spin { display:inline-block; width:20px;height:20px;border:3px solid var(--line);border-top-color:var(--coral);border-radius:50%;animation:sp 1s linear infinite; }
  @keyframes sp { to { transform: rotate(360deg); } }
  .table-scroll { overflow-x:auto; }
  .hidden { display:none; }
</style>
</head>
<body>
<div class="wrap">
  <div class="kicker">Administração</div>
  <h1>Reservas de Kits de Festa 🎈</h1>

  <div id="login" class="card" style="max-width:380px;margin-top:16px">
    <label style="font-weight:700;font-size:14px;display:block;margin-bottom:6px">Token de acesso</label>
    <input type="password" id="token" placeholder="FESTAS_ADMIN_TOKEN" style="width:100%">
    <button class="btn" id="entrar" style="width:100%;margin-top:10px">Entrar</button>
    <div class="muted" style="font-size:12px;margin-top:8px">O token é o mesmo definido em <code>FESTAS_ADMIN_TOKEN</code> no n8n.</div>
  </div>

  <div id="painel" class="hidden">
    <div class="bar">
      <select id="filtro">
        <option value="TODAS">Todas</option>
        <option value="AGUARDANDO_PAGAMENTO">Aguardando pagamento</option>
        <option value="PAGO">Pagas</option>
        <option value="CANCELADO">Canceladas</option>
      </select>
      <button class="btn btn-sm" id="recarregar">↻ Atualizar</button>
      <span class="muted" id="updated" style="font-size:12px"></span>
    </div>
    <div class="stats" id="stats"></div>
    <div class="card table-scroll">
      <table id="tabela">
        <thead><tr>
          <th>Reserva</th><th>Data evento</th><th>Kit</th><th>Cliente</th><th>Pgto</th><th class="right">Total</th><th>Status</th><th>Ações</th>
        </tr></thead>
        <tbody id="tbody"><tr><td colspan="8" class="center"><span class="spin"></span></td></tr></tbody>
      </table>
    </div>
  </div>
</div>

<script src="config.js"></script>
<script>
(function(){
  const CFG = window.FESTAS_CONFIG || {};
  const API = (p) => (CFG.N8N_BASE||'').replace(/\/$/,'') + p;
  const $ = id => document.getElementById(id);
  let token = sessionStorage.getItem('festas_admin_token') || '';
  let reservas = [];

  const money = n => 'R$ ' + (Number(n)||0).toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2});
  const esc = s => String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
  const fmtData = d => { try { return new Date(String(d).slice(0,10)+'T00:00:00').toLocaleDateString('pt-BR'); } catch(e){ return d; } };

  async function api(body){
    const res = await fetch(API(CFG.ENDPOINTS.admin), {
      method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(Object.assign({token}, body))
    });
    return res.json();
  }

  async function carregar(){
    $('tbody').innerHTML = `<tr><td colspan="8" class="center"><span class="spin"></span></td></tr>`;
    try {
      const data = await api({ acao:'listar' });
      if (!data.ok) { alert(data.erro||'Erro'); if (String(data.erro||'').includes('Token')) logout(); return; }
      reservas = data.reservas || [];
      $('updated').textContent = 'atualizado ' + new Date().toLocaleTimeString('pt-BR');
      render();
    } catch(e){ $('tbody').innerHTML = `<tr><td colspan="8" class="center">Falha de conexão.</td></tr>`; }
  }

  function render(){
    const f = $('filtro').value;
    const lista = reservas.filter(r => f==='TODAS' ? true : String(r.status)===f)
      .sort((a,b)=> String(b.data_evento).localeCompare(String(a.data_evento)));
    // stats
    const c = (s)=> reservas.filter(r=>String(r.status)===s).length;
    const receita = reservas.filter(r=>String(r.status)==='PAGO').reduce((s,r)=>s+(Number(r.valor_total)||0),0);
    $('stats').innerHTML = `
      <div class="stat"><b>${reservas.length}</b><span>reservas</span></div>
      <div class="stat"><b>${c('AGUARDANDO_PAGAMENTO')}</b><span>aguardando</span></div>
      <div class="stat"><b>${c('PAGO')}</b><span>pagas</span></div>
      <div class="stat"><b>${money(receita)}</b><span>recebido</span></div>`;

    if (!lista.length){ $('tbody').innerHTML = `<tr><td colspan="8" class="center">Nenhuma reserva.</td></tr>`; return; }
    $('tbody').innerHTML = lista.map(r => {
      const st = String(r.status||'').toUpperCase();
      const wa = String(r.cliente_whatsapp||'').replace(/\D/g,'');
      const acoes = st === 'AGUARDANDO_PAGAMENTO'
        ? `<button class="btn-sm btn-ok" data-act="confirmar" data-id="${esc(r.id)}">✓ Confirmar Pix</button>
           <button class="btn-sm btn-no" data-act="cancelar" data-id="${esc(r.id)}">Cancelar</button>`
        : (st === 'PAGO' ? `<button class="btn-sm btn-no" data-act="cancelar" data-id="${esc(r.id)}">Cancelar</button>` : '—');
      return `<tr>
        <td><b>${esc(r.id)}</b><br><span class="muted">${esc(r.criado_em||'')}</span></td>
        <td>${fmtData(r.data_evento)}<br><span class="muted">${esc(r.periodo||'')}</span></td>
        <td>${esc(r.kit_nome||'')}</td>
        <td>${esc(r.cliente_nome||'')}<br><a href="https://wa.me/${wa}" target="_blank" class="muted">${esc(r.cliente_whatsapp||'')}</a><br><span class="muted">${esc(r.endereco||'')}</span></td>
        <td>${esc(r.metodo_pagamento||'')}</td>
        <td class="right">${money(r.valor_total)}</td>
        <td><span class="tag t-${st}">${st.replace(/_/g,' ')}</span></td>
        <td><div class="actions">${acoes}</div></td>
      </tr>`;
    }).join('');
    $('tbody').querySelectorAll('[data-act]').forEach(b => b.onclick = () => acao(b.dataset.act, b.dataset.id));
  }

  async function acao(acao, id){
    const txt = acao==='confirmar' ? 'Confirmar o pagamento Pix desta reserva?' : 'Cancelar esta reserva? A data será liberada.';
    if (!confirm(txt)) return;
    const data = await api({ acao, reserva_id: id });
    if (!data.ok){ alert(data.erro||'Erro'); return; }
    const r = reservas.find(x => String(x.id)===String(id)); if (r) r.status = data.status;
    render();
  }

  function logout(){ sessionStorage.removeItem('festas_admin_token'); token=''; $('painel').classList.add('hidden'); $('login').classList.remove('hidden'); }

  $('entrar').onclick = () => {
    token = $('token').value.trim();
    if (!token) return;
    sessionStorage.setItem('festas_admin_token', token);
    $('login').classList.add('hidden'); $('painel').classList.remove('hidden');
    carregar();
  };
  $('recarregar').onclick = carregar;
  $('filtro').onchange = render;

  if (token){ $('login').classList.add('hidden'); $('painel').classList.remove('hidden'); carregar(); }
})();
</script>
</body>
</html>
