<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pagamento aprovado 🎉</title>
<meta name="theme-color" content="#E86A5C">
<style>
  body { margin:0; background:#FFF8F3; color:#2f2a28; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; line-height:1.5; }
  .box { max-width:460px; margin:0 auto; min-height:100vh; display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; padding:30px; }
  .emoji { font-size:60px; } h1 { font-size:24px; margin:10px 0; }
  p { color:#8a807b; } .rid { font-weight:700; color:#2f2a28; }
  a.btn { margin-top:22px; background:#E86A5C; color:#fff; text-decoration:none; font-weight:700; padding:14px 22px; border-radius:13px; }
</style>
</head>
<body>
  <div class="box">
    <div class="emoji">🎉</div>
    <h1>Pagamento aprovado!</h1>
    <p>Sua reserva <span class="rid" id="rid"></span> está confirmada. Você vai receber os detalhes no WhatsApp. Obrigado por reservar com a gente!</p>
    <a class="btn" href="/festas/">Voltar ao catálogo</a>
  </div>
<script>
  const p = new URLSearchParams(location.search);
  const rid = p.get('external_reference') || p.get('reserva') || '';
  if (rid) document.getElementById('rid').textContent = '#' + rid;
</script>
</body>
</html>
