<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Não foi possível concluir o pagamento</title>
<meta name="theme-color" content="#E86A5C">
<style>
  body { margin:0; background:#FFF8F3; color:#2f2a28; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; line-height:1.5; }
  .box { max-width:460px; margin:0 auto; min-height:100vh; display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; padding:30px; }
  .emoji { font-size:60px; } h1 { font-size:24px; margin:10px 0; }
  p { color:#8a807b; } .rid { font-weight:700; color:#2f2a28; }
  a.btn { margin-top:22px; background:#E86A5C; color:#fff; text-decoration:none; font-weight:700; padding:14px 22px; border-radius:13px; }
  a.ghost { margin-top:12px; color:#8a807b; text-decoration:none; font-weight:600; }
</style>
</head>
<body>
  <div class="box">
    <div class="emoji">😕</div>
    <h1>Não deu certo dessa vez</h1>
    <p>O pagamento da reserva <span class="rid" id="rid"></span> não foi concluído. Sua data ainda pode estar disponível — tente de novo ou fale com a gente.</p>
    <a class="btn" href="/festas/">Tentar novamente</a>
    <a class="ghost" id="wa" href="#">Falar no WhatsApp</a>
  </div>
<script src="config.js"></script>
<script>
  const p = new URLSearchParams(location.search);
  const rid = p.get('external_reference') || p.get('reserva') || '';
  if (rid) document.getElementById('rid').textContent = '#' + rid;
  const num = (window.FESTAS_CONFIG||{}).WHATSAPP_CONTATO || '';
  document.getElementById('wa').href = 'https://wa.me/' + num;
</script>
</body>
</html>
